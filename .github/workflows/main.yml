name: Build Jailbreak Tweak (Rootless)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: checkout code
      uses: actions/checkout@v4
      
    - name: setup theos
      run: |
        # install theos dependencies using brew
        brew install make ldid
        
        # set PATH to use brew's GNU make
        echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
        
        # set theos environment variables
        export THEOS=$HOME/theos
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        echo "export PATH=$THEOS/bin:$PATH" >> $GITHUB_ENV
        
        # clone theos
        git clone --recursive https://github.com/theos/theos.git $THEOS
        
        # create theos configuration file
        mkdir -p $THEOS
        cat > $THEOS/theos.conf << EOF
        THEOS_PLATFORM_SDK_ROOT = $THEOS/sdks
        EOF
        
        # setup frameworks directory
        mkdir -p $THEOS/lib
        
        - name: setup ios sdk and dependencies
      run: |
        export THEOS=$HOME/theos
        export PATH=$THEOS/bin:$PATH
        
        # 1. Download iOS SDK using sparse checkout from official theos sdks
        git clone --quiet -n --depth=1 --filter=tree:0 https://github.com
        cd sdks
        git sparse-checkout set --no-cone iPhoneOS14.5.sdk
        git checkout
        mkdir -p $THEOS/sdks
        mv *.sdk $THEOS/sdks/
        cd ..
        rm -rf sdks
        
        # 2. Clone and isolate AltList framework compilation
        git clone --recursive https://github.com /tmp/AltList
        cd /tmp/AltList
        
        # Strip out the test projects causing the iOS 16.5 SDK crash
        sed -i '' 's/SUBPROJECTS.*/SUBPROJECTS = /' Makefile
        
        # Force AltList to build the core framework using your active 14.5 SDK
        make clean
        ./install_to_theos.sh TARGET=iphone:clang:14.5:14.0
        
        # 3. Clean up temporary files
        cd $GITHUB_WORKSPACE
        rm -rf /tmp/AltList

        
    - name: update version from commit
      run: |
        cd $GITHUB_WORKSPACE
        
        # get commit number (short sha) or use run number as fallback
        COMMIT_NUMBER=$(git rev-parse --short HEAD 2>/dev/null || echo "${{ github.run_number }}")
        
        # update version in control file using run number for better versioning
        VERSION="1.6.${{ github.run_number }}"
        
        # update control file (macos uses different sed syntax)
        sed -i '' "s/^Version: .*/Version: $VERSION/" control
        
        # verify change
        echo "Updated version to: $VERSION"
        grep "^Version:" control
        
    - name: build tweak
      run: |
        export THEOS=$HOME/theos
        export PATH=$THEOS/bin:$PATH
        
        # build the main tool for rootless jailbreaks (dopamine, palera1n, etc.)
        cd $GITHUB_WORKSPACE
        make package THEOS_PACKAGE_SCHEME=rootless DEBUG=0 FINALPACKAGE=1 ARCHS=arm64e TARGET=iphone:clang:14.5:14.0
        
        # list built artifacts
        ls -la packages/
        
    - name: upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: tweak-package
        path: packages/
        retention-days: 30
